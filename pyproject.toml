[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-execution-simulator"
version = "0.1.0"
description = "Transparent comparison of equity execution schedules on historical minute bars"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
